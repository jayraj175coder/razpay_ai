[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverai-api"
version = "1.0.0"
description = "Production-Grade AI Revenue Recovery Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RecoverAI Team" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "app",
    "../.."
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
