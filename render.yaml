services:
  - type: web
    name: recoverai-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: PAYMENT_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: '["*"]'
